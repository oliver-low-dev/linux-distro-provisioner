[apt]
	[apt.debian]
		core = ("apt-transport-https")
		network = ("systemd-resolved", "openvpn", "wireguard", "tor", "proxychains", "proxyhcains4")
		virtualization = ("qemu-system-x86", "libvirt0", "virt-viewer", "virt-manager")
		graphicalManager = ("lightdm", "gdm3")
		graphicalInterfaces = ("xfce4", "gnome", "kde", "i3-wm", "sway")
		browsers = ("firefox-esr", "chromium", "epiphany-browser")
		development = ("nasm", "gcc", "g++", "arduino", "openjdk-25-jdk", "python3")
		utils = ("extrepo", "evince")
		[apt.debian.xfce]
			xfce4Pack = ("xfce4-terminal", "thunar")
		[apt.debian.graphical]
			xorg = ("xserver-xorg-intel", "mesa-utils")
			wayland = ("wayland", "mesa-utils")
			lightdm = ("lightdm-gtk-greeter")
